<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">VK favicon</title>
  <desc id="desc">Transparent VK monogram in cyan and green.</desc>

  <defs>
    <linearGradient id="accent" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#020617" flood-opacity="0.55" />
    </filter>
  </defs>

  <circle cx="14" cy="13" r="4.5" fill="url(#accent)" filter="url(#softShadow)" />
  <text
    x="32"
    y="45"
    text-anchor="middle"
    fill="url(#accent)"
    filter="url(#softShadow)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-2"
  >VK</text>
</svg>
